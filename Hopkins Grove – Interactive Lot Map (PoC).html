<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hopkins Grove – Interactive Lot Map (Proof of Concept)</title>
<style>
:root{box-sizing:border-box;--bg:#f6f4ee;--card:#fff;--ink:#1d2b22;--mute:#667064;--line:#d9d5c8;--acc:#2f6b45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1d261f;--ink:#e8eee9;--mute:#97a49a;--line:#324036;--acc:#6fcf93}}
:root[data-theme="dark"]{--bg:#141a16;--card:#1d261f;--ink:#e8eee9;--mute:#97a49a;--line:#324036;--acc:#6fcf93}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-family:Georgia,serif}.pill{font-size:11px;background:var(--acc);color:#fff;border-radius:99px;padding:2px 8px}
.bar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);align-items:center}
button,.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
button.on,.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip{display:flex;gap:6px;align-items:center;font-size:12px}.chip i{width:12px;height:12px;border-radius:3px;border:1px solid #0003}
.chip.off{opacity:.45}
main{flex:1;min-height:0;display:flex;flex-direction:column}
@media(min-width:820px){main{flex-direction:row}}
#map{flex:1;min-height:0;position:relative;overflow:hidden;background:#fff;touch-action:none}
#map svg{width:100%;height:100%;display:block}
.lot{stroke:#0000;stroke-width:.6;cursor:pointer}.lot:hover{stroke:#000;stroke-width:1.2}.lot.sel{stroke:#d10;stroke-width:2}
.lot.flag{stroke:#c0c;stroke-dasharray:2 1}
#tip{position:absolute;pointer-events:none;background:#000d;color:#fff;border-radius:6px;padding:3px 8px;font-size:12px;display:none;white-space:nowrap}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
aside{background:var(--card);border-top:1px solid var(--line);padding:12px 14px;overflow:auto;max-height:42%}
@media(min-width:820px){aside{width:330px;max-height:none;border-top:0;border-left:1px solid var(--line)}}
aside h2{font-size:15px;margin:0 0 4px}aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:14px 0 6px}
.kv{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
.st{display:inline-block;border-radius:99px;padding:1px 9px;color:#fff;font-size:12px}
.upd{padding:6px 0;border-bottom:1px solid var(--line)}.upd small{color:var(--mute)}
.note{font-size:11px;color:var(--mute);margin-top:12px}
</style></head><body>
